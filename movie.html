<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МувиМуд — Фильм</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #050505;
        --surface: #FFFFFF;
        --text-main: #FFFFFF;
        --text-dark: #000000;
        --text-muted: #888888;
        --border-color: rgba(255,255,255,0.1);
        --accent: #FACC15;
        --accent-hover: #EAB308;
        --purple: #A855F7;
        --purple-dark: #7C3AED;
        --purple-glow: rgba(168, 85, 247, 0.4);
        --green: #22C55E;
        --danger: #ff4d6d;
        --radius-sm: 14px;
        --radius-md: 24px;
        --header-h: 70px;
        --font: 'Inter', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: var(--font);
        background: var(--bg); color: var(--text-main);
        min-height: 100vh; line-height: 1.5; font-size: 16px;
        -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent-hover); }

    .header {
        display: grid; grid-template-columns: auto 1fr auto;
        gap: 32px; align-items: center;
        padding: 0 40px; height: var(--header-h);
        background: rgba(5, 5, 5, 0.85);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-color);
        position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; display: flex; align-items: center; }
    .logo span { color: var(--text-muted); font-weight: 400; }
    .search-container { position: relative; width: 100%; max-width: 400px; justify-self: center; }
    .search-input {
        width: 100%; background: rgba(255,255,255,0.05);
        border: 1px solid transparent; border-radius: 100px;
        padding: 10px 20px 10px 44px; color: var(--text-main);
        font-size: 14px; font-family: var(--font); outline: none; transition: all 0.2s ease;
    }
    .search-input:focus { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon {
        position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
        width: 16px; height: 16px; fill: none; stroke: var(--text-muted); stroke-width: 2; pointer-events: none;
    }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
        width: 40px; height: 40px; border-radius: 50%;
        background: transparent; border: 1px solid var(--border-color);
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; color: var(--text-muted); transition: all 0.2s ease;
    }
    .icon-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    .icon-btn.active { color: #ff4d6d; border-color: #ff4d6d; }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .ai-search-btn {
        width: 40px; height: 40px; border-radius: 50%;
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(168, 85, 247, 0.1) 100%);
        border: 1px solid rgba(168, 85, 247, 0.4);
        display: flex; justify-content: center; align-items: center;
        color: #C084FC; cursor: pointer; transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
    }
    .ai-search-btn:hover {
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(168, 85, 247, 0.2) 100%);
        border-color: rgba(168, 85, 247, 0.6); color: #E9D5FF;
        box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); transform: scale(1.05);
    }
    .ai-search-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
    .avatar-btn {
        width: 40px; height: 40px; border-radius: 50%;
        background: var(--surface); border: none;
        display: flex; justify-content: center; align-items: center;
        color: var(--text-dark); font-weight: 600; font-size: 14px;
        cursor: pointer; transition: transform 0.2s ease;
    }
    .avatar-btn:hover { transform: scale(1.05); }

    .container { max-width: 1200px; margin: 0 auto; padding: 40px 40px 80px; }
    .back-link {
        display: inline-flex; align-items: center; gap: 8px;
        color: var(--text-muted); font-size: 14px; font-weight: 500;
        margin-bottom: 32px; transition: color 0.2s ease;
    }
    .back-link:hover { color: var(--text-main); }
    .back-link svg { width: 16px; height: 16px; }

    /* HERO */
    .movie-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; margin-bottom: 56px; align-items: start; }
    .movie-trailer-wrapper {
        position: relative; width: 100%; aspect-ratio: 16 / 9;
        overflow: hidden; border-radius: var(--radius-md);
        background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); cursor: pointer;
    }
    .movie-trailer-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .movie-trailer-wrapper:hover img { transform: scale(1.03); }
    .play-button {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 72px; height: 72px;
        background: linear-gradient(135deg, #A855F7 0%, #7C3AED 100%);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 8px 32px rgba(168, 85, 247, 0.4);
    }
    .movie-trailer-wrapper:hover .play-button { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 12px 40px rgba(168, 85, 247, 0.6); }
    .play-button svg { width: 28px; height: 28px; fill: #fff; margin-left: 3px; }

    .movie-info h1 { font-size: 42px; font-weight: 700; color: var(--text-main); line-height: 1.1; margin-bottom: 16px; letter-spacing: -0.02em; }
    .movie-teaser { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); margin-bottom: 20px; font-weight: 500; }
    .movie-teaser .sep { color: var(--text-muted); opacity: 0.5; }
    .movie-teaser .teaser-age {
        background: rgba(255,255,255,0.08); border: 1px solid var(--border-color);
        color: var(--text-main); padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
    }
    .movie-logline { font-size: 16px; line-height: 1.6; color: rgba(255,255,255,0.8); margin-bottom: 28px; }

    /* РЯД ДЕЙСТВИЙ */
    .actions-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 32px; }
    .btn-watch {
        background: linear-gradient(135deg, #A855F7 0%, #7C3AED 100%);
        color: #fff; border: none; border-radius: 14px;
        padding: 0 30px; height: 52px; font-size: 15px; font-weight: 700; font-family: var(--font);
        cursor: pointer; display: inline-flex; align-items: center; gap: 9px;
        transition: all 0.3s ease; text-decoration: none;
        box-shadow: 0 8px 24px rgba(168, 85, 247, 0.35);
    }
    .btn-watch:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(168, 85, 247, 0.5); color: #fff; }
    .btn-watch svg { width: 18px; height: 18px; fill: currentColor; }
    .btn-trailer {
        background: rgba(255,255,255,0.06); color: var(--text-main);
        border: 1px solid var(--border-color); border-radius: 14px;
        padding: 0 26px; height: 52px; font-size: 15px; font-weight: 600; font-family: var(--font);
        cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease;
        text-decoration: none;
    }
    .btn-trailer:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); color: var(--text-main); }
    .btn-trailer svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

    .icon-action {
        width: 52px; height: 52px; border-radius: 14px;
        background: rgba(255,255,255,0.06); border: 1px solid var(--border-color);
        display: inline-flex; align-items: center; justify-content: center;
        color: var(--text-muted); cursor: pointer; transition: all 0.2s ease; padding: 0;
    }
    .icon-action:hover { color: var(--text-main); background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }
    .icon-action svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-action.on-save { color: var(--accent); border-color: rgba(250,204,21,0.5); background: rgba(250,204,21,0.12); }
    .icon-action.on-save svg { fill: var(--accent); }
    .icon-action.on-watch { color: #60A5FA; border-color: rgba(96,165,250,0.5); background: rgba(96,165,250,0.12); }
    .icon-action.on-hide { color: var(--danger); border-color: rgba(255,77,109,0.5); background: rgba(255,77,109,0.12); }

    .specs { display: grid; gap: 12px; }
    .spec-row { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; }
    .spec-label { color: var(--text-muted); font-size: 14px; }
    .spec-values { display: flex; flex-wrap: wrap; gap: 8px; }
    .spec-tag {
        background: rgba(255,255,255,0.05); color: var(--text-main);
        border: 1px solid var(--border-color); border-radius: 8px; padding: 4px 12px; font-size: 13px; font-weight: 500;
    }

    /* СЕКЦИЯ О ФИЛЬМЕ — 2 КОЛОНКИ */
    .section-heading { font-size: 26px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; margin-bottom: 24px; }
    
    .about-grid { 
        display: grid; 
        grid-template-columns: 1.5fr 1fr; 
        gap: 24px; 
        margin-bottom: 56px; 
        align-items: start; 
    }

    .about-left { display: flex; flex-direction: column; gap: 24px; }

    .about-block { 
        background: rgba(255,255,255,0.02); 
        border: 1px solid var(--border-color); 
        border-radius: var(--radius-md); 
        padding: 32px; 
    }

    .ai-recommendation-block {
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.1) 0%, rgba(168, 85, 247, 0.03) 100%);
        border: 1px solid rgba(168, 85, 247, 0.25); border-radius: var(--radius-sm); padding: 24px;
    }
    .ai-rec-header {
        display: flex; align-items: center; gap: 10px; color: #C084FC;
        font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;
    }
    .ai-rec-header svg { width: 16px; height: 16px; }
    .ai-rec-text { font-size: 15px; line-height: 1.65; color: rgba(255,255,255,0.9); }

    .about-subtitle { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 14px; }
    .about-text { font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.7; white-space: pre-line; }

    /* РЕЙТИНГ — правая колонка */
    .rate-block { 
        background: rgba(255,255,255,0.02); 
        border: 1px solid var(--border-color); 
        border-radius: var(--radius-md); 
        padding: 28px; 
        display: flex; 
        flex-direction: column; 
        gap: 8px; 
    }
    .rate-top { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .rate-value { font-size: 56px; font-weight: 800; color: var(--green); line-height: 1; letter-spacing: -0.02em; }
    .rate-title { font-size: 18px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
    .rate-meta { font-size: 13px; color: var(--text-muted); }
    .rate-buttons { display: flex; gap: 10px; }
    .rate-btn {
        flex: 1; background: rgba(255,255,255,0.05); color: var(--text-main);
        border: 1px solid var(--border-color); border-radius: var(--radius-sm);
        padding: 12px 16px; font-size: 14px; font-weight: 600; font-family: var(--font);
        cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;
    }
    .rate-btn:hover { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
    .rate-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(250, 204, 21, 0.1); }

    /* ОТЗЫВЫ */
    .reviews-block { margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px; }
    .reviews-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .reviews-head-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
    .reviews-count { font-size: 12px; font-weight: 600; color: var(--text-muted); background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); padding: 2px 10px; border-radius: 100px; }
    .review-item { padding: 14px 0; border-bottom: 1px solid var(--border-color); }
    .review-item:last-of-type { border-bottom: none; }
    .review-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .review-author { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .review-date { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .review-text { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.75); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .review-likes { margin-top: 6px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .reviews-all-btn {
        width: 100%; margin-top: 16px; background: transparent; color: var(--text-main);
        border: 1px solid var(--border-color); border-radius: 100px; padding: 12px 20px;
        font-size: 14px; font-weight: 600; font-family: var(--font); cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;
    }
    .reviews-all-btn:hover { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); }
    .reviews-all-btn svg { width: 14px; height: 14px; }

    /* КЛИПЫ */
    .clips-section { margin-bottom: 56px; }
    .clips-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .clips-title { font-size: 24px; font-weight: 700; color: var(--text-main); }
    .clips-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
    .clips-container { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 8px; }
    .clips-container::-webkit-scrollbar { display: none; }
    .clip-card { flex: 0 0 auto; width: 180px; scroll-snap-align: start; cursor: pointer; transition: transform 0.2s ease; }
    .clip-card:hover { transform: translateY(-4px); }
    .clip-thumbnail { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: var(--radius-sm); overflow: hidden; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); margin-bottom: 10px; }
    .clip-thumbnail img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
    .clip-card:hover .clip-thumbnail img { transform: scale(1.05); }
    .clip-play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; }
    .clip-card:hover .clip-play-overlay { opacity: 1; }
    .clip-play-btn { width: 44px; height: 44px; background: rgba(250, 204, 21, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .clip-play-btn svg { width: 18px; height: 18px; fill: var(--text-dark); margin-left: 2px; }
    .clip-duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: var(--text-main); padding: 3px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .clip-views { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: var(--text-main); padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .clip-views svg { width: 12px; height: 12px; fill: currentColor; }
    .clip-title { font-size: 14px; font-weight: 600; color: var(--text-main); line-height: 1.3; margin-bottom: 4px; }
    .clip-desc { font-size: 12px; color: var(--text-muted); line-height: 1.3; }

    /* КОМАНДА */
    .team-block { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 32px; margin-bottom: 56px; }
    .team-title { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 24px; }
    .team-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .team-chip {
        background: transparent; color: var(--text-muted); border: 1px solid var(--border-color);
        border-radius: 100px; padding: 8px 18px; font-size: 13px; font-weight: 500; font-family: var(--font);
        cursor: pointer; transition: all 0.2s ease;
    }
    .team-chip:hover { border-color: rgba(255,255,255,0.3); color: var(--text-main); }
    .team-chip.active { background: var(--text-main); color: var(--text-dark); border-color: var(--text-main); }
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 24px; }
    .person { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
    .person-avatar {
        width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center;
        font-size: 24px; font-weight: 700; color: var(--text-muted); overflow: hidden;
    }
    .person-name { font-size: 14px; font-weight: 600; color: var(--text-main); line-height: 1.3; }
    .person-role { font-size: 12px; color: var(--text-muted); margin-top: -8px; }

    /* ПОХОЖИЕ */
    .similar-section { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 32px; margin-bottom: 56px; }
    .similar-title { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 20px; }
    .similar-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .similar-filter {
        background: transparent; color: var(--text-muted); border: 1px solid var(--border-color);
        border-radius: 100px; padding: 8px 20px; font-size: 13px; font-weight: 500; font-family: var(--font);
        cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
    }
    .similar-filter:hover { border-color: rgba(255,255,255,0.3); color: var(--text-main); }
    .similar-filter.active { background: var(--text-main); color: var(--text-dark); border-color: var(--text-main); }
    .similar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
    .card { cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: transform 0.2s ease; }
    .card:hover { transform: translateY(-4px); }
    .card-poster { position: relative; width: 100%; aspect-ratio: 2 / 3; overflow: hidden; border-radius: var(--radius-sm); background: rgba(255,255,255,0.05); }
    .card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: var(--accent); padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; backdrop-filter: blur(4px); }
    .card-title { font-size: 14px; font-weight: 600; color: var(--text-main); line-height: 1.3; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border-color); border-radius: 100px; padding: 3px 10px; font-size: 11px; font-weight: 500; }

    /* ФАКТЫ */
    .facts-section { margin-bottom: 56px; }
    .facts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .fact-card {
        background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
        border-radius: 16px; padding: 20px; min-height: 150px;
        display: flex; flex-direction: column; justify-content: space-between;
        transition: border-color 0.2s ease, background 0.2s ease;
    }
    .fact-card:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
    .fact-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
    .fact-globe { width: 22px; height: 22px; fill: none; stroke: var(--text-muted); stroke-width: 1.6; }
    .fact-source-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text-muted); transition: color 0.2s ease; }
    .fact-source-link:hover { color: var(--accent); }
    .fact-source-link svg { width: 11px; height: 11px; }
    .fact-text { font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.85); }

    /* НАГРАДЫ */
    .info-section { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 32px; margin-bottom: 24px; }
    .info-title { font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 20px; }
    .list-clean { list-style: none; }
    .list-clean li { padding: 12px 0; border-bottom: 1px solid var(--border-color); color: rgba(255,255,255,0.8); line-height: 1.6; font-size: 14px; }
    .list-clean li:last-child { border-bottom: none; }
    .list-clean li strong { color: var(--text-main); font-weight: 600; }

    /* ТОСТ */
    .toast {
        position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(24px);
        background: #1A1A1A; border: 1px solid var(--border-color); color: var(--text-main);
        padding: 14px 24px; border-radius: 100px; font-size: 14px; font-weight: 500;
        opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 300;
        box-shadow: 0 12px 32px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 10px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast svg { width: 16px; height: 16px; fill: none; stroke: var(--accent); stroke-width: 2; }

    /* НЕ НАЙДЕНО */
    .not-found {
        text-align: center;
        padding: 100px 20px;
    }
    .not-found h1 {
        font-size: 40px;

    .not-found p {

        color: var(--text-muted);
        margin-bottom: 32px;
    }
    .not-found .btn-watch {
        display: inline-flex;
        text-decoration: none;
    }

    .footer { border-top: 1px solid var(--border-color); padding: 40px; text-align: center; color: var(--text-muted); font-size: 14px; }

    @media (max-width: 900px) {
        .header { grid-template-columns: auto auto; gap: 16px; padding: 0 20px; }
        .search-container { order: 3; grid-column: 1 / -1; max-width: none; }
        .movie-hero { grid-template-columns: 1fr; gap: 32px; }
        .about-grid { grid-template-columns: 1fr; }
        .movie-info h1 { font-size: 32px; }
        .container { padding: 24px 20px 60px; }
        .facts-grid { grid-template-columns: 1fr; }
    }
</style>
