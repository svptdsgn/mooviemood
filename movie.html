var teamFilter='cast',similarFilter='mood';
var userState={saved:{},watched:{},hidden:{}};
try{var raw=localStorage.getItem('mv_user_state');if(raw)userState=JSON.parse(raw);}catch(e){}
function saveState(){try{localStorage.setItem('mv_user_state',JSON.stringify(userState));}catch(e){}}
var toastTimer;
function showToast(msg){var t=document.getElementById('toast');t.innerHTML='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>'+msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
var ICON={bookmark:'<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>',eye:'<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>',ban:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>',play:'<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>',film:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>'};
function initials(n){var p=n.split(' ');return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():n.substring(0,2).toUpperCase();}
function formatRuntime(m){var h=Math.floor(m/60),mm=m%60;return h>0&&mm>0?h+'ч '+mm+' мин':h>0?h+'ч':mm+' мин';}
function createSimilarCard(m){var c=document.createElement('div');c.className='card';c.innerHTML='<div class="card-poster"><img src="'+m.poster+'" alt="'+m.title+'"><div class="card-badge">'+m.rating+'</div></div><div class="card-title">'+m.title+'</div><div class="card-tags">'+m.genres.slice(0,2).map(g=>'<span class="tag">'+g+'</span>').join('')+'</div>';c.addEventListener('click',()=>window.location.href='movie.html?id='+m.id);return c;}
function renderTeam(m){var grid=document.getElementById('team-grid');if(!grid)return;grid.innerHTML='';var list=[];
if(teamFilter==='cast')list=m.cast||[];else if(teamFilter==='directors')list=(m.directors||[]).map(n=>({name:n,role:'Режиссёр'}));else if(teamFilter==='producers')list=(m.producers||[]).map(n=>({name:n,role:'Продюсер'}));else if(teamFilter==='screenwriters')list=(m.screenwriters||[]).map(n=>({name:n,role:'Сценарист'}));else if(teamFilter==='composers')list=(m.composers||[]).map(n=>({name:n,role:'Композитор'}));
if(!list.length){grid.innerHTML='<div style="color:var(--text-muted);padding:20px;grid-column:1/-1;text-align:center">Данные не указаны.</div>';return;}
list.forEach(p=>{var el=document.createElement('div');el.className='person';el.innerHTML='<div class="person-avatar">'+initials(p.name)+'</div><div class="person-name">'+p.name+'</div><div class="person-role">'+p.role+'</div>';grid.appendChild(el);});}
function renderSimilarMovies(m){var grid=document.getElementById('similar-grid');if(!grid)return;grid.innerHTML='';var sim=[];
if(similarFilter==='mood')sim=movies.filter(x=>x.id!==m.id&&x.mood&&m.mood&&x.mood.split(' ')[0]===m.mood.split(' ')[0]);
else if(similarFilter==='genre')sim=movies.filter(x=>x.id!==m.id&&x.genres.some(g=>m.genres.indexOf(g)!==-1));
else if(similarFilter==='director')sim=movies.filter(x=>x.id!==m.id&&x.directors[0]===m.directors[0]);
if(!sim.length){grid.innerHTML='<div style="color:var(--text-muted);padding:40px;text-align:center;grid-column:1/-1">Пока нет похожих фильмов в этой категории</div>';return;}
sim.slice(0,6).forEach(x=>grid.appendChild(createSimilarCard(x)));}
function renderFacts(m){var grid=document.getElementById('facts-grid');if(!grid||!m.facts)return;m.facts.forEach(f=>{var c=document.createElement('div');c.className='fact-card';c.innerHTML='<div class="fact-card-top"><svg class="fact-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg><a class="fact-source-link" href="'+f.url+'" target="_blank" rel="noopener">Источник<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg></a></div><p class="fact-text">'+f.text+'</p>';grid.appendChild(c);});}
function renderReviews(m){var wrap=document.getElementById('reviews-wrap');if(!wrap)return;var r=m.reviews||[];
if(!r.length){wrap.innerHTML='<div class="reviews-block"><div class="reviews-head"><span class="reviews-head-title">Отзывы</span></div><div style="font-size:13px;color:var(--text-muted);padding:8px 0">Пока нет отзывов.</div></div>';return;}
wrap.innerHTML='<div class="reviews-block"><div class="reviews-head"><span class="reviews-head-title">Отзывы</span><span class="reviews-count">'+r.length+'</span></div>'+r.slice(0,2).map(x=>'<div class="review-item"><div class="review-top"><span class="review-author">'+x.author+'</span><span class="review-date">'+x.date+'</span></div><p class="review-text">'+x.text+'</p><div class="review-likes">👍 '+x.likes+'</div></div>').join('')+'<button class="reviews-all-btn"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Читать все отзывы</button></div>';
var b=wrap.querySelector('.reviews-all-btn');if(b)b.addEventListener('click',()=>showToast('Все отзывы: '+r.length+' шт.'));}
function buildActionsRow(m){var s=userState.saved[m.id],w=userState.watched[m.id],h=userState.hidden[m.id];
return '<div class="actions-row"><a href="'+m.kpUrl+'" target="_blank" rel="noopener" class="btn-watch">'+ICON.play+' Смотреть</a><a href="'+m.trailerUrl+'" target="_blank" rel="noopener" class="btn-trailer">'+ICON.film+' Трейлер</a><button class="icon-action '+(s?'on-save':'')+'" id="act-save" title="Смотреть позже">'+ICON.bookmark+'</button><button class="icon-action '+(w?'on-watch':'')+'" id="act-watch" title="Уже смотрел">'+ICON.eye+'</button><button class="icon-action '+(h?'on-hide':'')+'" id="act-hide" title="Скрыть">'+ICON.ban+'</button></div>';}
function bindActions(m){var sb=document.getElementById('act-save'),wb=document.getElementById('act-watch'),hb=document.getElementById('act-hide');
sb.addEventListener('click',()=>{if(userState.saved[m.id]){delete userState.saved[m.id];sb.classList.remove('on-save');showToast('Убрано из «Смотреть позже»');}else{userState.saved[m.id]=true;sb.classList.add('on-save');showToast('Сохранено на потом');}saveState();});
wb.addEventListener('click',()=>{if(userState.watched[m.id]){delete userState.watched[m.id];wb.classList.remove('on-watch');showToast('Убрал отметку «просмотрено»');}else{userState.watched[m.id]=true;wb.classList.add('on-watch');showToast('Отмечено как просмотренное');}saveState();});
hb.addEventListener('click',()=>{if(userState.hidden[m.id]){delete userState.hidden[m.id];hb.classList.remove('on-hide');showToast('Фильм снова в рекомендациях');}else{userState.hidden[m.id]=true;hb.classList.add('on-hide');showToast('Скрыт — больше не будет в рекомендациях');}saveState();});}
function renderMovie(){
var params=new URLSearchParams(window.location.search),id=parseInt(params.get('id'));
var movie=movies.find(m=>m.id===id),container=document.getElementById('movie-detail');
if(!movie){document.title='Фильм не найден — МувиМуд';container.innerHTML='<div class="not-found"><h1>Фильм не найден</h1><p>Похоже, такой картины нет в нашей базе.</p><a href="index.html" class="btn-watch" style="display:inline-flex">Вернуться в каталог</a></div>';return;}
document.title=movie.title+' — МувиМуд';
var countries=movie.countries.join(', '),languages=movie.languages.join(', '),runtime=formatRuntime(movie.runtime);
var teaser=runtime+' <span class="sep">·</span> '+movie.year+' <span class="sep">·</span> '+countries+' <span class="sep">·</span> <span class="teaser-age">'+movie.age+'</span>';
var specs='<div class="spec-row"><div class="spec-label">Жанр</div><div class="spec-values">'+movie.genres.map(g=>'<span class="spec-tag">'+g+'</span>').join('')+'</div></div><div class="spec-row"><div class="spec-label">Время</div><div class="spec-values"><span class="spec-tag">'+movie.runtime+' мин</span></div></div><div class="spec-row"><div class="spec-label">Язык</div><div class="spec-values"><span class="spec-tag">'+languages+'</span></div></div><div class="spec-row"><div class="spec-label">Страна</div><div class="spec-values"><span class="spec-tag">'+countries+'</span></div></div><div class="spec-row"><div class="spec-label">Премьера</div><div class="spec-values"><span class="spec-tag">'+(movie.premiere||movie.year)+'</span></div></div>';
var votesText=movie.votes?movie.votes.toLocaleString('ru-RU')+' оценок':'Оценок пока нет';
container.innerHTML=
'<section class="movie-hero"><div class="movie-trailer-wrapper"><img src="'+movie.poster+'" alt="'+movie.title+'"><div class="play-button">'+ICON.play+'</div></div><div class="movie-info"><h1>'+movie.title+' <span>('+movie.year+')</span></h1><div class="movie-teaser">'+teaser+'</div><div class="movie-logline">'+movie.logline+'</div>'+buildActionsRow(movie)+'<div class="specs">'+specs+'</div></div></section>'+
'<h2 class="section-heading">О фильме</h2>'+
'<section class="about-grid"><div class="about-left"><div class="about-block"><div class="ai-recommendation-block"><div class="ai-rec-header"><svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path></svg><span>Почему стоит посмотреть</span></div><p class="ai-rec-text">'+movie.aiRecommendation+'</p></div></div><div class="about-block"><h3 class="about-subtitle">Синопсис</h3><p class="about-text">'+movie.synopsis+'</p></div></div>'+
'<div class="rate-block"><div class="rate-top"><div class="rate-value">'+movie.rating+'</div><div><div class="rate-title">Высокий рейтинг</div><div class="rate-meta">'+votesText+'</div></div></div><div class="rate-buttons"><button class="rate-btn" data-rate="up">👍 Нравится</button><button class="rate-btn" data-rate="down">Не нравится</button></div><div id="reviews-wrap"></div></div></section>'+
'<section class="team-block"><h2 class="team-title">Актёры и съёмочная группа</h2><div class="team-filters"><button class="team-chip active" data-filter="cast">В главных ролях</button><button class="team-chip" data-filter="directors">Режиссёр</button><button class="team-chip" data-filter="producers">Продюсеры</button><button class="team-chip" data-filter="screenwriters">Сценаристы</button><button class="team-chip" data-filter="composers">Композитор</button></div><div class="team-grid" id="team-grid"></div></section>'+
'<section class="similar-section"><h2 class="similar-title">Похожие фильмы</h2><div class="similar-filters"><button class="similar-filter active" data-filter="mood">По настроению</button><button class="similar-filter" data-filter="genre">По жанру</button><button class="similar-filter" data-filter="director">По режиссёру</button></div><div class="similar-grid" id="similar-grid"></div></section>'+
'<section class="facts-section"><h2 class="section-heading">Несколько фактов</h2><div class="facts-grid" id="facts-grid"></div></section>'+
'<section class="info-section"><h2 class="info-title">Награды</h2><ul class="list-clean">'+(movie.awards.length?movie.awards.map(a=>'<li>'+(a.result==='win'?'🏆 ':'🎗 ')+'<strong>'+a.event+' ('+a.year+')</strong> — '+a.category+(a.result==='win'?' (победа)':' (номинация)')+'</li>').join(''):'<li>Награды не указаны.</li>')+'</ul></section>';
bindActions(movie);
document.querySelectorAll('.rate-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.rate-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');showToast(b.dataset.rate==='up'?'Спасибо! Учтём при подборе':'Понял, реже буду это предлагать');}));
document.querySelectorAll('.team-chip').forEach(ch=>ch.addEventListener('click',()=>{document.querySelectorAll('.team-chip').forEach(x=>x.classList.remove('active'));ch.classList.add('active');teamFilter=ch.dataset.filter;renderTeam(movie);}));
document.querySelectorAll('.similar-filter').forEach(f=>f.addEventListener('click',()=>{document.querySelectorAll('.similar-filter').forEach(x=>x.classList.remove('active'));f.classList.add('active');similarFilter=f.dataset.filter;renderSimilarMovies(movie);}));
renderTeam(movie);renderSimilarMovies(movie);renderFacts(movie);renderReviews(movie);}
document.addEventListener('DOMContentLoaded',function(){var p=new URLSearchParams(window.location.search);if(!p.get('id'))window.location.href='index.html';else renderMovie();});
</script>
