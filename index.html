  <script>
    let movieData = [];
    let filteredMovies = [];
    let currentIndex = 0;
    const savedMovies = new Set();
    const watchedMovies = new Set();

    function getRatingClass(rating) {
      const num = parseFloat(rating);
      if (num >= 7.5) return 'high';
      if (num >= 6.0) return 'medium';
      return 'low';
    }

    function createCard(data, index) {
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.dataset.index = index;
      card.style.backgroundImage = `url('${data.poster}')`;

      const ratingClass = getRatingClass(data.rating);
      const isSaved = savedMovies.has(index);

      card.innerHTML = `
        <div class="rating-badge ${ratingClass}">${data.rating}</div>
        <div class="card-actions">
          <button class="card-action-btn save-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave(${index}, event)" title="Сохранить">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          </button>
          <button class="card-action-btn" onclick="expandCard(${index}, event)" title="Подробнее">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <div class="expanded-poster" style="background-image: url('${data.poster}')"></div>
        <div class="expanded-content">
            <button class="expanded-close" onclick="collapseCard(event)" title="Закрыть">×</button>
            <h2 class="expanded-title">${data.title}</h2>
            <div class="expanded-mood">${data.mood}</div>
            <div class="ai-recommendation">
                <div class="ai-label">
                    <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path></svg>
                    ПОЧЕМУ ВАМ СТОИТ ПОСМОТРЕТЬ
                </div>
                <p class="expanded-desc">${data.whyWatch || 'Этот фильм обладает уникальной атмосферой и сильным сюжетом.'}</p>
            </div>
        </div>
      `;

      card.addEventListener('click', (e) => {
        if (e.target.closest('.card-action-btn') || e.target.closest('.expanded-close') || card.classList.contains('expanded')) return;
        if (currentIndex !== index) {
          currentIndex = index;
          updateCarousel();
        }
      });

      return card;
    }

    function toggleSave(index, e) {
      e.stopPropagation();
      if (savedMovies.has(index)) savedMovies.delete(index);
      else savedMovies.add(index);
      const cards = stage.querySelectorAll('.movie-card');
      cards.forEach(c => {
        if (parseInt(c.dataset.index) === index) {
          const btn = c.querySelector('.save-btn');
          if (btn) btn.classList.toggle('saved');
        }
      });
    }

    function initCarousel() {
      stage.innerHTML = '';
      for (let i = -2; i <= 2; i++) {
        let dataIndex = (currentIndex + i + movieData.length) % movieData.length;
        let card = createCard(movieData[dataIndex], currentIndex + i);
        stage.appendChild(card);
      }
      updateCarousel();
    }

    function updateCarousel() {
      const cards = stage.querySelectorAll('.movie-card');
      if (stage.querySelector('.expanded')) return;

      cards.forEach((card) => {
        let diff = parseInt(card.dataset.index) - currentIndex;
        card.classList.remove('pos-0', 'pos--1', 'pos-1', 'pos--2', 'pos-2', 'pos--3', 'pos-3');
        
        if (diff === 0) card.classList.add('pos-0');
        else if (diff === -1) card.classList.add('pos--1');
        else if (diff === 1) card.classList.add('pos-1');
        else if (diff === -2) card.classList.add('pos--2');
        else if (diff === 2) card.classList.add('pos-2');
        else if (diff < -2) card.classList.add('pos--3');
        else if (diff > 2) card.classList.add('pos-3');
      });

      let mainDataIndex = (currentIndex + movieData.length) % movieData.length;
      document.getElementById('mainTitle').textContent = movieData[mainDataIndex].title;
      document.getElementById('mainMood').textContent = movieData[mainDataIndex].mood;
    }

    function expandCard(index, e) {
      e.stopPropagation();
      const cards = stage.querySelectorAll('.movie-card');
      let targetCard = null;
      cards.forEach(c => { if (parseInt(c.dataset.index) === index) targetCard = c; });
      if (targetCard) {
        targetCard.classList.add('expanded');
        carouselContainer.classList.add('has-expanded');
        stage.classList.add('has-expanded');
      }
    }

    function collapseCard(e) {
      e.stopPropagation();
      const expandedCard = stage.querySelector('.expanded');
      if (expandedCard) {
        expandedCard.classList.remove('expanded');
        carouselContainer.classList.remove('has-expanded');
        stage.classList.remove('has-expanded');
      }
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + movieData.length) % movieData.length;
      initCarousel();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % movieData.length;
      initCarousel();
    });

    const randomAiOverlay = document.getElementById('randomAiOverlay');
    const chatAiOverlay = document.getElementById('chatAiOverlay');
    const eyeOverlay = document.getElementById('eyeOverlay');

    document.getElementById('openRandomAiBtn').addEventListener('click', () => randomAiOverlay.classList.add('active'));
    document.getElementById('closeRandomAi').addEventListener('click', () => { randomAiOverlay.classList.remove('active'); resetToFilters(); });
    randomAiOverlay.addEventListener('click', (e) => { if (e.target === randomAiOverlay) { randomAiOverlay.classList.remove('active'); resetToFilters(); } });

    document.getElementById('openChatAiBtn').addEventListener('click', () => {
      chatAiOverlay.classList.add('active');
      document.getElementById('chatInput').focus();
    });
    document.getElementById('closeChatAi').addEventListener('click', () => chatAiOverlay.classList.remove('active'));
    chatAiOverlay.addEventListener('click', (e) => { if (e.target === chatAiOverlay) chatAiOverlay.classList.remove('active'); });

    // Обработчик закрытия глазной модалки (только крестик)
    document.getElementById('eyeClose').addEventListener('click', () => eyeOverlay.classList.remove('active'));
    eyeOverlay.addEventListener('click', (e) => { if (e.target === eyeOverlay) eyeOverlay.classList.remove('active'); });
    
    document.getElementById('eyeWatchBtn').addEventListener('click', () => {
      const movieId = document.getElementById('eyeWatchBtn').dataset.movieId;
      if (movieId) window.location.href = 'movie.html?id=' + movieId;
    });

    function showEyeModal(index) {
      const movie = movieData[index];
      const ratingClass = getRatingClass(movie.rating);
      
      document.getElementById('eyePoster').style.backgroundImage = `url('${movie.poster}')`;
      document.getElementById('eyeTitle').textContent = movie.title;
      // Ограничиваем текст 800 символами
      let text = movie.whyWatch || 'Этот фильм обладает уникальной атмосферой и сильным сюжетом.';
      if (text.length > 800) text = text.substring(0, 800) + '...';
      document.getElementById('eyeText').textContent = text;
      document.getElementById('eyeWatchBtn').dataset.movieId = movie.id;
      
      const badgesHtml = `
        <span class="eye-badge rating ${ratingClass}">★ ${movie.rating}</span>
        <span class="eye-badge">${movie.year}</span>
        <span class="eye-badge">${movie.runtime} мин</span>
        <span class="eye-badge">${movie.country}</span>
        <span class="eye-badge">${movie.age}</span>
        <span class="eye-badge">${movie.format}</span>
      `;
      document.getElementById('eyeBadges').innerHTML = badgesHtml;
      
      eyeOverlay.classList.add('active');
    }

    function toggleChip(chip) { chip.classList.toggle('active'); }
    function toggleSwitch(el) { el.classList.toggle('active'); }
    function toggleDuration(chip) { chip.classList.toggle('active'); }
    
    function resetFilters() {
      document.querySelectorAll('.option-chip').forEach(chip => chip.classList.remove('active'));
      document.querySelectorAll('.duration-chip').forEach(chip => chip.classList.remove('active'));
      document.querySelectorAll('.toggle-switch').forEach(sw => sw.classList.remove('active'));
    }

    function resetToFilters() {
      document.getElementById('aiFilters').style.display = 'block';
      document.getElementById('aiResults').style.display = 'none';
    }

    // ЛОГИКА СЛУЧАЙНОГО ПОДБОРА (учитывает продолжительность)
    document.getElementById('generateRandomBtn').addEventListener('click', () => {
      randomAiOverlay.classList.remove('active');
      resetToFilters();
      
      // Фильтруем по выбранной продолжительности
      const activeDuration = document.querySelector('.duration-chip.active');
      let filteredForRandom = [...movieData];
      
      if (activeDuration) {
        const text = activeDuration.textContent.trim();
        if (text === '< 90 мин') {
          filteredForRandom = filteredForRandom.filter(m => m.runtime < 90);
        } else if (text === '90-120 мин') {
          filteredForRandom = filteredForRandom.filter(m => m.runtime >= 90 && m.runtime <= 120);
        } else if (text === '> 120 мин') {
          filteredForRandom = filteredForRandom.filter(m => m.runtime > 120);
        }
      }
      
      if (filteredForRandom.length === 0) {
        alert("По выбранным параметрам ничего не найдено.");
        return;
      }
      
      // Берем случайный фильм из отфильтрованных
      const randomMovie = filteredForRandom[Math.floor(Math.random() * filteredForRandom.length)];
      const idx = movieData.findIndex(m => m.id === randomMovie.id);
      
      currentIndex = idx;
      initCarousel();
      
      setTimeout(() => {
        const cards = stage.querySelectorAll('.movie-card');
        const centerCard = cards[2];
        if (centerCard) {
          centerCard.classList.add('expanded');
          carouselContainer.classList.add('has-expanded');
          stage.classList.add('has-expanded');
        }
      }, 400);
    });

    function resetAiSearch() {
      document.getElementById('aiFilters').style.display = 'block';
      document.getElementById('aiResults').style.display = 'none';
    }

    function toggleAiDesc(header) {
      const desc = header.nextElementSibling;
      const isOpen = desc.classList.contains('open');
      document.querySelectorAll('.result-ai-desc').forEach(d => d.classList.remove('open'));
      if (!isOpen) desc.classList.add('open');
    }

    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');
    
    function addMessage(text, isUser) {
      const msg = document.createElement('div');
      msg.className = `message ${isUser ? 'user' : 'ai'}`;
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    document.getElementById('sendChatBtn').addEventListener('click', () => {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage(text, true);
      chatInput.value = '';
      setTimeout(() => {
        addMessage("Отличный запрос! Исходя из вашего описания, я рекомендую обратить внимание на фильм «Седьмая печать» или «Пожары». Хотите, я расскажу подробнее о сюжете одного из них?", false);
      }, 800);
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('sendChatBtn').click();
    });

    // ЛОГИКА ЧЕКБОКСОВ
    function toggleCheckbox(el) {
      el.classList.toggle('active');
      applyFilters();
    }

    // КАТАЛОГ И ФИЛЬТРАЦИЯ
    function renderCatalog(movies = movieData) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';
      
      if (movies.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted);">Фильмы не найдены. Попробуйте изменить фильтры.</div>';
        return;
      }
      
      movies.forEach((movie, idx) => {
        const originalIdx = movieData.findIndex(m => m.id === movie.id);
        const ratingClass = getRatingClass(movie.rating);
        const isSaved = savedMovies.has(originalIdx);
        
        const item = document.createElement('div');
        item.className = 'catalog-item';
        
        item.innerHTML = `
          <div class="catalog-poster-wrap" style="background-image: url('${movie.poster}')" data-idx="${originalIdx}">
            <div class="catalog-poster-rating ${ratingClass}">${movie.rating}</div>
            <button class="catalog-save-btn ${isSaved ? 'saved' : ''}" data-save-idx="${originalIdx}" title="Сохранить на потом">
              <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </button>
            <button class="catalog-eye-btn" data-eye-idx="${originalIdx}" title="Почему стоит посмотреть">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
            <div class="catalog-poster-overlay">
              <div class="catalog-poster-title">${movie.title}</div>
            </div>
          </div>
          <div class="catalog-meta">
            <div class="catalog-meta-title">${movie.title}</div>
            <div class="catalog-meta-info">
              <span>${movie.year}</span>
              <span class="dot"></span>
              <span>${movie.runtime} мин</span>
              <span class="dot"></span>
              <span>${movie.country}</span>
            </div>
          </div>
        `;
        
        grid.appendChild(item);
      });

      grid.querySelectorAll('.catalog-save-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.saveIdx);
          if (savedMovies.has(idx)) savedMovies.delete(idx);
          else savedMovies.add(idx);
          btn.classList.toggle('saved');
        });
      });

      grid.querySelectorAll('.catalog-eye-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.eyeIdx);
          showEyeModal(idx);
        });
      });

      grid.querySelectorAll('.catalog-poster-wrap').forEach(wrap => {
        wrap.addEventListener('click', (e) => {
          if (e.target.closest('.catalog-eye-btn') || e.target.closest('.catalog-save-btn')) return;
          const idx = parseInt(wrap.dataset.idx);
          const movie = movieData[idx];
          window.location.href = 'movie.html?id=' + movie.id;
        });
      });
    }

    function renderCountryFilters() {
      const countries = [...new Set(movieData.map(m => m.country))].sort(); // Сортировка по алфавиту
      const container = document.getElementById('countryFilters');
      container.innerHTML = '';
      countries.forEach(country => {
        const label = document.createElement('label');
        label.className = 'checkbox-item';
        label.setAttribute('onclick', 'toggleCheckbox(this)');
        label.innerHTML = `
          <input type="checkbox" value="${country}">
          <span class="checkbox-mark"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
          ${country}
        `;
        container.appendChild(label);
      });
    }

    function renderGenreFilters() {
      const allGenres = new Set();
      movieData.forEach(m => m.genres.forEach(g => allGenres.add(g)));
      const container = document.getElementById('genreFilters');
      container.innerHTML = '';
      Array.from(allGenres).sort().forEach(genre => { // Сортировка по алфавиту
        const label = document.createElement('label');
        label.className = 'checkbox-item';
        label.setAttribute('onclick', 'toggleCheckbox(this)');
        label.innerHTML = `
          <input type="checkbox" value="${genre}">
          <span class="checkbox-mark"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
          ${genre}
        `;
        container.appendChild(label);
      });
    }

    function setupCheckboxHandlers() {
      // Больше не нужно, так как onclick прописан в HTML
    }

    function applyFilters() {
      let filtered = [...movieData];
      
      // Страна
      const selectedCountries = [...document.querySelectorAll('#countryFilters .checkbox-item.active input')].map(cb => cb.value);
      if (selectedCountries.length > 0) {
        filtered = filtered.filter(m => selectedCountries.includes(m.country));
      }
      
      // Год
      const selectedYears = [...document.querySelectorAll('#yearFilters .checkbox-item.active input')].map(cb => cb.value);
      if (selectedYears.length > 0) {
        filtered = filtered.filter(m => {
          if (selectedYears.includes('before2000') && m.year < 2000) return true;
          if (selectedYears.includes('2000to2010') && m.year >= 2000 && m.year <= 2010) return true;
          if (selectedYears.includes('2010to2020') && m.year > 2010 && m.year <= 2020) return true;
          if (selectedYears.includes('after2020') && m.year > 2020) return true;
          return false;
        });
      }
      
      // Продолжительность
      const selectedRuntimes = [...document.querySelectorAll('#runtimeFilters .checkbox-item.active input')].map(cb => cb.value);
      if (selectedRuntimes.length > 0) {
        filtered = filtered.filter(m => {
          if (selectedRuntimes.includes('short') && m.runtime < 90) return true;
          if (selectedRuntimes.includes('medium') && m.runtime >= 90 && m.runtime <= 120) return true;
          if (selectedRuntimes.includes('long') && m.runtime > 120) return true;
          return false;
        });
      }
      
      // Рейтинг
      const selectedRatings = [...document.querySelectorAll('#ratingFilters .checkbox-item.active input')].map(cb => cb.value);
      if (selectedRatings.length > 0) {
        filtered = filtered.filter(m => {
          const rating = parseFloat(m.rating);
          if (selectedRatings.includes('high') && rating >= 8.0) return true;
          if (selectedRatings.includes('medium') && rating >= 7.0 && rating < 8.0) return true;
          if (selectedRatings.includes('low') && rating < 7.0) return true;
          return false;
        });
      }
      
      // Возраст
      const selectedAges = [...document.querySelectorAll('#ageFilters .checkbox-item.active input')].map(cb => cb.value);
      if (selectedAges.length > 0) {
        filtered = filtered.filter(m => selectedAges.includes(m.age));
      }
      
      // Жанры
      const selectedGenres = [...document.querySelectorAll('#genreFilters .checkbox-item.active input')].map(cb => cb.value);
      if (selectedGenres.length > 0) {
        filtered = filtered.filter(m => 
          m.genres && m.genres.some(g => selectedGenres.includes(g))
        );
      }
      
      // Убрать просмотренные
      const hideWatched = document.querySelector('.filter-toggle-item:last-child .filter-toggle').classList.contains('active');
      if (hideWatched) {
        filtered = filtered.filter(m => !watchedMovies.has(m.id));
      }

      filteredMovies = filtered;
      renderCatalog(filtered);
    }

    function resetAllFilters() {
      document.querySelectorAll('.checkbox-item').forEach(item => {
        item.classList.remove('active');
        const input = item.querySelector('input');
        if (input) input.checked = false;
      });
      document.querySelectorAll('.filter-toggle').forEach(toggle => toggle.classList.remove('active'));
      filteredMovies = [...movieData];
      renderCatalog();
    }

    function switchFilterTab(tab, btn) {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.filter-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`filter-${tab}`).classList.add('active');
    }

    function toggleFilterSwitch(el) {
      el.classList.toggle('active');
      applyFilters();
    }

    function toggleFilterSection(header) {
      const section = header.parentElement;
      section.classList.toggle('open');
    }

    // ЗАГРУЗКА ДАННЫХ ИЗ JSON
    setTimeout(() => {
      fetch('movies.json')
        .then(response => response.json())
        .then(data => {
          movieData = data.movies.map(item => {
            return {
              id: item.identification.kinopoisk_id,
              title: item.identification.title_ru,
              year: item.identification.year,
              rating: item.ratings.kinopoisk.value,
              votes: item.ratings.kinopoisk.votes,
              runtime: item.details.runtime_minutes,
              age: item.details.age_ratings[0].rating,
              country: item.details.countries[0],
              countries: item.details.countries,
              genres: item.details.genres,
              format: item.identification.film_type.includes('документальный') ? 'Документальный' : (item.identification.film_type.includes('анимационный') ? 'Мультфильм' : 'Фильм'),
              mood: item.content.mood,
              whyWatch: item.content.synopsis, // Полный текст, обрезается в модалке
              poster: item.poster.path,
              trailer: item.poster.path,
              kpUrl: item.identification.kinopoisk_url,
              trailerUrl: item.links.official_trailer.url
            };
          });
          
          filteredMovies = [...movieData];
          
          currentIndex = Math.floor(movieData.length / 2);
          initCarousel();
          renderCatalog();
          renderCountryFilters();
          renderGenreFilters();
        })
        .catch(error => console.error('Ошибка загрузки данных:', error));
    }, 300);
  </script>
</body>
</html>
